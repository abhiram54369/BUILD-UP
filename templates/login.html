{% extends 'auth.html' %}{% block title %}Log in — Build Up{% endblock %}{% set eyebrow='Good to have you back' %}{% set heading='Log in.' %}{% set subheading='Pick up where you left off.' %}{% block form %}<div class="field full"><label for="email">EMAIL</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field full"><label for="password">PASSWORD</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Your password"></div><div class="field full"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="remember" style="width:auto"> Keep me signed in</label></div><div class="field full"><button class="btn primary" type="submit">Log in ↗</button></div>{% endblock %}{% block authfoot %}New to Build Up? <a href="{{ url_for('signup') }}" style="color:var(--text)">Create an account</a>{% endblock %}
